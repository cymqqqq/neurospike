[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "neurospike"
version = "0.1.0"
description = "Offline macOS action-potential analysis for current-clamp ABF and CSV recordings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "pyabf>=2.3.8,<3",
  "PySide6-Essentials==6.9.3",
  "pyqtgraph==0.13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1.2,<2", "pyinstaller>=6.11,<7"]

[project.scripts]
neurospike = "neurospike.cli:main"

[project.gui-scripts]
neurospike-gui = "neurospike.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
